<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iniciar sesión · Rural 11</title>
  <meta name="theme-color" content="#17153B">
  <script src="/js/core/theme-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <button class="theme-toggle theme-toggle--floating" id="theme-toggle" type="button" aria-label="Cambiar tema"></button>

  <main class="auth">
    <section class="auth__brand">
      <div class="auth__logo">
        <img class="auth__logo-img" src="/icons/favicon.svg" alt="" width="44" height="44">
        <p class="auth__name">Rural 11</p>
      </div>
      <figure class="route-banner">
        <svg class="route-banner__svg" viewBox="0 0 300 100" role="img" aria-label="Ruta con tres paradas hacia la meta">
          <path class="rt-base" d="M32 74 C 90 74, 100 54, 150 52 S 230 28, 268 24"/>
          <path class="rt-done" d="M32 74 C 90 74, 100 54, 150 52"/>
          <circle class="rt-node-done" cx="32" cy="74" r="13"/>
          <path class="rt-check" d="M26 74 l4.5 4.5 l8 -9"/>
          <circle class="rt-halo" cx="150" cy="52" r="19"/>
          <circle class="rt-node-now" cx="150" cy="52" r="14"/>
          <circle class="rt-dot" cx="150" cy="52" r="4.5"/>
          <circle class="rt-node-flag" cx="268" cy="24" r="13"/>
          <path class="rt-flag" d="M263 19 v11 M263 19 h9 l-2.5 3.5 l2.5 3.5 h-9"/>
        </svg>
        <figcaption class="route-banner__text">Tu ruta al ICFES empieza aquí</figcaption>
      </figure>
    </section>

    <section class="auth__panel">
      <form id="login-form" class="auth__form" novalidate autocomplete="off">
        <h1 class="auth__title">¡Qué bueno verte!</h1>
        <p class="auth__lead">Entra con tu número de identidad y sigue subiendo de nivel.</p>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="field">
          <label class="field__label" for="documentNumber">Número de identidad</label>
          <div class="field__control">
            <input class="field__input" id="documentNumber" name="documentNumber" type="text"
                   inputmode="numeric" pattern="[0-9]*" placeholder="Ingresa tu documento de identidad"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   aria-describedby="document-error" required>
          </div>
          <p class="field__error" id="document-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="field__control">
            <input class="field__input" id="password" name="password" type="password"
                   autocomplete="new-password" aria-describedby="password-error" required>
            <button class="field__toggle" id="toggle-password" type="button"
                    aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
          <p class="field__error" id="password-error" hidden></p>
        </div>
        <p class="auth-switch">¿Olvidaste tu contraseña? <a href="/reset-password.html">Restablecer contraseña</a></p>

        <label class="check">
          <input type="checkbox" id="remember" name="remember">
          <span>Recordar credenciales</span>
        </label>

        <button class="btn btn--primary" id="submit" type="submit">Iniciar sesión</button>

        <p class="auth-switch">¿No tienes cuenta? <a href="/register.html">Crear cuenta</a></p>
      </form>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
